version: 2.1

commands:
  install_pnpm:
    steps:
      - run:
          name: Install pnpm 11.22.0
          command: sudo npm install --global pnpm@11.22.0

jobs:
  application:
    docker:
      - image: cimg/node:24.4-browsers
    resource_class: medium
    environment:
      APP_ENV: local
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - checkout
      - install_pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile --network-concurrency=4 --child-concurrency=2
      - run:
          name: Formatting, lint, types, unit tests, release gates, and build
          command: pnpm check
      - run:
          name: Install Playwright Chromium
          command: pnpm exec playwright install --with-deps chromium
      - run:
          name: Production end-to-end tests
          command: pnpm test:e2e
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

  mobile:
    docker:
      - image: cimg/node:24.4
    resource_class: medium
    working_directory: ~/project/apps/mobile
    environment:
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install mobile dependencies
          command: npm ci --legacy-peer-deps
      - run:
          name: Mobile TypeScript and formatting checks
          command: npm run check
      - run:
          name: Expo dependency and configuration validation
          command: npx expo-doctor@latest

  database:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      APP_ENV: local
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      SUPABASE_AUTH_SMS_TWILIO_MESSAGE_SERVICE_SID: MG00000000000000000000000000000000
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: local-test-token-not-a-secret
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - checkout
      - run:
          name: Install Node.js 24
          command: |
            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node --version
            npm --version
      - install_pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile --network-concurrency=4 --child-concurrency=2
      - run:
          name: Validate unique Supabase migration versions
          command: |
            set -euo pipefail
            duplicates="$(
              find supabase/migrations -maxdepth 1 -type f -name '[0-9]*_*.sql' -printf '%f\n' \
                | sed -E 's/^([0-9]+)_.*/\1/' \
                | sort \
                | uniq -d
            )"
            if [ -n "$duplicates" ]; then
              echo "Duplicate Supabase migration version(s):"
              printf '%s\n' "$duplicates"
              exit 1
            fi
      - run:
          name: Start local Supabase
          command: pnpm db:start
      - run:
          name: Export local browser-safe Supabase credentials
          command: |
            pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|ANON_KEY)=' > /tmp/supabase-status.env
            set -a
            source /tmp/supabase-status.env
            set +a
            echo "export NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$BASH_ENV"
            echo "export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-${ANON_KEY:-}}" >> "$BASH_ENV"
      - run:
          name: pgTAP database tests
          command: |
            set +e
            pnpm test:db 2>&1 | tee /tmp/pgtap.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if grep -q "All tests successful\." /tmp/pgtap.log \
              && grep -q "error running container: exit 125" /tmp/pgtap.log; then
              echo "pgTAP passed; ignoring transient pg_prove Docker cleanup failure."
              exit 0
            fi
            exit "$status"
      - run:
          name: Build application against local Supabase
          command: pnpm build
      - run:
          name: Install Playwright Chromium
          command: pnpm exec playwright install --with-deps chromium
      - run:
          name: Verified waitlist integration test
          command: MITHAQ_E2E_SUPABASE=1 pnpm exec playwright test tests/e2e/waitlist-integration.spec.ts
      - store_artifacts:
          path: playwright-report
          destination: waitlist-integration-playwright-report
      - run:
          name: Stop local Supabase
          command: pnpm db:stop
          when: always

workflows:
  mithaq_ci:
    jobs:
      - application
      - mobile
      - database
