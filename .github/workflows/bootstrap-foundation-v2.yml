name: Publish Milestone 1 foundation
# Bootstrap revision: pwa-e2e-stability-2

on:
  push:
    branches:
      - agent/milestone-1-foundation
    paths:
      - .github/workflows/bootstrap-foundation-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-milestone-1-foundation
  cancel-in-progress: true

jobs:
  expand-validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: local
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: bootstrap-public-placeholder

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Expand the prepared source tree
        run: |
          for script in .bootstrap/*.sh; do
            echo "Running ${script}"
            bash "${script}"
          done

          python3 <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["packageManager"] = "pnpm@11.22.0"
          package["type"] = "module"
          package["dependencies"]["@supabase/supabase-js"] = "^2.112.3"
          package["dependencies"]["next"] = "16.3.1"
          package["dependencies"]["next-intl"] = "4.13.6"
          package["devDependencies"]["@testing-library/jest-dom"] = "6.9.1"
          package["devDependencies"]["eslint-config-next"] = "16.3.1"
          package["devDependencies"]["supabase"] = "2.114.0"
          package.pop("pnpm", None)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")
          PY

          cat > pnpm-workspace.yaml <<'YAML'
          strictDepBuilds: true
          allowBuilds:
            '@parcel/watcher': true
            '@swc/core': true
            esbuild: true
            sharp: true
            supabase: true
            unrs-resolver: true
          YAML

          # The Actions token cannot add or update workflow files. The connected
          # GitHub app installs the validated CI workflow in a separate commit.
          rm -f .github/workflows/ci.yml
          rm -rf .bootstrap

      - name: Install pnpm and Node.js 24
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Install and lock dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate reproducible PWA icons
        run: pnpm icons:generate

      - name: Format the expanded project
        run: pnpm format

      - name: Run formatting, lint, type, unit, and production build checks
        run: pnpm check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production end-to-end tests
        run: pnpm test:e2e

      - name: Start local Supabase
        run: pnpm db:start

      - name: Run pgTAP database tests
        run: pnpm test:db

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop || true

      - name: Commit the validated application files and lockfile
        run: |
          generated_dir="$(mktemp -d)"
          rsync -a \
            --exclude='.git' \
            --exclude='.github/workflows' \
            ./ "${generated_dir}/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          published=false
          for attempt in 1 2 3; do
            git fetch origin agent/milestone-1-foundation
            git reset --hard origin/agent/milestone-1-foundation
            git clean -fdx

            rsync -a --delete \
              --exclude='.git' \
              --exclude='.github/workflows' \
              "${generated_dir}/" ./
            rm -rf .bootstrap

            git add -A
            git commit -m "Build Milestone 1 foundation [skip ci]"

            if git push origin HEAD:agent/milestone-1-foundation; then
              published=true
              break
            fi

            echo "Publish race detected; retrying from the latest branch head (${attempt}/3)."
          done

          test "${published}" = true
