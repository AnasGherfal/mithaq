name: Rebuild Milestone 1 foundation

on:
  push:
    branches:
      - agent/milestone-1-foundation
    paths:
      - .github/workflows/rebuild-milestone-one.yml

permissions:
  contents: write

env:
  APP_ENV: preview
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: bootstrap-publishable-key

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-1-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate the complete source tree
        run: python3 .bootstrap/rebuild_m1.py
      - name: Commit deterministic source
        run: |
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Milestone 1 foundation source"
          git push origin HEAD:agent/milestone-1-foundation
      - name: Install pnpm
        run: npm install --global pnpm@11.0.0
      - name: Resolve dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate assets and format
        run: |
          pnpm icons:generate
          pnpm format
      - name: Commit lockfile and generated assets
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Lock dependencies and generate foundation assets"
            git push origin HEAD:agent/milestone-1-foundation
          fi
      - name: Run application checks
        run: pnpm check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production E2E checks
        run: pnpm test:e2e
      - name: Run database smoke test
        run: |
          pnpm db:start
          trap 'pnpm db:stop' EXIT
          pnpm test:db
