name: Finalize Milestone 1 foundation

on:
  push:
    branches:
      - agent/milestone-1-foundation
    paths:
      - .github/workflows/finalize-milestone-one.yml

permissions:
  contents: write
  pull-requests: write

env:
  APP_ENV: preview
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-publishable-key
  GH_TOKEN: ${{ github.token }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-1-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply final validation fixes
        run: |
          python3 .bootstrap/fix_validation.py
          rm -rf .bootstrap .github/workflows/finalize-milestone-one.yml
      - name: Install pnpm
        run: npm install --global pnpm@11.0.0
      - name: Resolve and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm icons:generate
          pnpm format
      - name: Commit final source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Milestone 1 foundation"
          git push origin HEAD:agent/milestone-1-foundation
      - name: Run ordered application checks
        run: pnpm check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production browser checks
        run: pnpm test:e2e
      - name: Run local database smoke test
        run: |
          pnpm db:start
          trap 'pnpm db:stop' EXIT
          pnpm test:db
      - name: Capture environment information
        run: pnpm exec next info
      - name: Record successful validation
        run: |
          cat > docs/validation.md <<EOF
          # Milestone 1 validation

          Validated in a clean GitHub-hosted Ubuntu environment on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          - Node: $(node --version)
          - pnpm: $(pnpm --version)
          - pnpm check: passed
          - pnpm test:e2e: passed
          - pnpm test:db: passed

          The service-worker policy, locale directionality, mobile overflow, serious/critical axe findings, installable manifest resources, health endpoint and pgTAP runner are covered by the committed acceptance suite.

          This branch contains Milestone 1 only and no Stage A business feature.
          EOF
          git add docs/validation.md
          git commit -m "Record successful Milestone 1 validation"
          git push origin HEAD:agent/milestone-1-foundation
      - name: Open or retain a draft pull request
        run: |
          if ! gh pr view agent/milestone-1-foundation --repo AnasGherfal/mithaq >/dev/null 2>&1; then
            cat > /tmp/pr-body.md <<'EOF'
          ## What changed

          - established the Next.js, strict TypeScript, Tailwind and shadcn foundation
          - added Arabic-first locale routing with server-rendered RTL/LTR semantics
          - added validated environment and publishable-key-only Supabase client boundaries
          - added a privacy-conservative PWA shell, manifest, offline fallback and update controls
          - added unit, accessibility, browser and pgTAP smoke tests
          - added read-only CI and operating documentation

          ## Validation

          - `pnpm check`
          - `pnpm test:e2e`
          - `pnpm test:db`

          ## Boundary

          This pull request contains Milestone 1 only. It does not implement OTP, waitlist, profiles, matching, messaging, identity verification or administration.
          EOF
            gh pr create \
              --repo AnasGherfal/mithaq \
              --base main \
              --head agent/milestone-1-foundation \
              --draft \
              --title "Build Milestone 1 project foundation" \
              --body-file /tmp/pr-body.md
          fi
