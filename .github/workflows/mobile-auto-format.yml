name: Mobile auto format

on:
  push:
    branches:
      - agent/mobile-app-foundation

permissions:
  contents: write

jobs:
  format-mobile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/mobile-app-foundation
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Format mobile package
        working-directory: apps/mobile
        run: npx prettier --write .

      - name: Commit formatting
        run: |
          if git diff --quiet -- apps/mobile; then
            echo "Mobile package already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          git commit -m "Format mobile package"
          git push origin HEAD:agent/mobile-app-foundation
