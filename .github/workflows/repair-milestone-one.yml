name: Repair and validate Milestone 1

on:
  push:
    branches:
      - agent/milestone-1-foundation
    paths:
      - .github/workflows/repair-milestone-one.yml

permissions:
  contents: write
  pull-requests: write

env:
  APP_ENV: preview
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-publishable-key
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-1-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply repair pass
        run: |
          python3 .bootstrap/repair_m1.py
          rm -rf .bootstrap .github/workflows/repair-milestone-one.yml
      - name: Install pnpm
        run: npm install --global pnpm@11.0.0
      - name: Resolve dependencies and generate assets
        run: |
          pnpm install --no-frozen-lockfile
          pnpm icons:generate
          pnpm format
      - name: Commit repaired source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair and lock Milestone 1 foundation"
          git push origin HEAD:agent/milestone-1-foundation
      - name: Run application checks
        run: pnpm check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production E2E checks
        run: pnpm test:e2e
      - name: Run database smoke test
        run: |
          pnpm db:start
          trap 'pnpm db:stop' EXIT
          pnpm test:db
      - name: Record successful validation
        run: |
          cat > docs/validation.md <<EOF
          # Milestone 1 validation

          Validated automatically on $(date -u +%Y-%m-%dT%H:%M:%SZ) using Node $(node --version) and pnpm $(pnpm --version).

          The following commands completed successfully in a clean GitHub-hosted Ubuntu environment:

          - pnpm check
          - pnpm exec playwright install --with-deps chromium
          - pnpm test:e2e
          - pnpm db:start
          - pnpm test:db
          - pnpm db:stop

          This validation covers the Milestone 1 foundation only. No Stage A business feature is present.
          EOF
          git add docs/validation.md
          git commit -m "Record Milestone 1 validation"
          git push origin HEAD:agent/milestone-1-foundation
      - name: Open draft pull request
        run: |
          if ! gh pr view agent/milestone-1-foundation --repo AnasGherfal/mithaq >/dev/null 2>&1; then
            gh pr create \
              --repo AnasGherfal/mithaq \
              --base main \
              --head agent/milestone-1-foundation \
              --draft \
              --title "Build Milestone 1 project foundation" \
              --body "## What changed

          - established the Next.js, TypeScript, Tailwind and shadcn foundation
          - added Arabic-first locale routing with server-rendered RTL/LTR semantics
          - added validated environment and publishable-key-only Supabase client boundaries
          - added a privacy-conservative PWA shell, manifest, offline fallback and update controls
          - added unit, accessibility, browser and pgTAP smoke tests
          - added read-only CI and operating documentation

          ## Validation

          - pnpm check
          - pnpm test:e2e
          - pnpm test:db

          ## Boundary

          This pull request contains Milestone 1 only. It does not implement OTP, waitlist, profiles, matching, messaging, identity verification or administration."
          fi
