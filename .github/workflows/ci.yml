name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: local
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js 24
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture canonical formatting for Milestone 3
        run: |
          pnpm format
          git diff --binary > milestone-3-format.patch

      - name: Upload Milestone 3 formatting patch
        uses: actions/upload-artifact@v7
        with:
          name: milestone-3-format-patch
          path: milestone-3-format.patch
          retention-days: 1

      - name: Run formatting, lint, type, unit, and build checks
        run: pnpm check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production end-to-end tests
        run: pnpm test:e2e

      - name: Upload mobile reference screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-reference-screenshots
          path: test-results/*-mobile.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      # Temporary formatter-capture steps above will be removed after the patch is applied.
      # Milestone 5: pin all third-party actions to reviewed full commit SHAs.

  database:
    name: Supabase database smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js 24
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Run pgTAP database tests
        run: pnpm test:db

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

      # Milestone 5: pin all third-party actions to reviewed full commit SHAs.
