name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: local
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js 24
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run formatting, lint, type, unit, and build checks
        run: pnpm check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production end-to-end tests
        run: pnpm test:e2e

      - name: Upload mobile reference screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-reference-screenshots
          path: test-results/*-mobile.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      # Milestone 5: pin all third-party actions to reviewed full commit SHAs.

  mobile:
    name: Mobile foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install mobile dependencies
        run: npm install

      - name: Run mobile TypeScript and formatting checks
        run: npm run check

      - name: Validate Expo dependencies and configuration
        run: npx expo-doctor@latest

  database:
    name: Supabase database and waitlist integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      SUPABASE_AUTH_SMS_TWILIO_MESSAGE_SERVICE_SID: MG00000000000000000000000000000000
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: local-test-token-not-a-secret

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js 24
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Export local browser-safe Supabase credentials
        run: |
          pnpm exec supabase status -o env > /tmp/supabase-status.env
          set -a
          source /tmp/supabase-status.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-${ANON_KEY:-}}" >> "$GITHUB_ENV"

      - name: Run pgTAP database tests
        run: pnpm test:db

      - name: Build application against local Supabase
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run verified waitlist integration test
        env:
          MITHAQ_E2E_SUPABASE: "1"
        run: pnpm exec playwright test tests/e2e/waitlist-integration.spec.ts

      - name: Upload waitlist integration report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: waitlist-integration-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

      # Milestone 5: pin all third-party actions to reviewed full commit SHAs.
