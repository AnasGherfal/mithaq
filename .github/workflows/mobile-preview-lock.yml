name: Refresh SDK 54 mobile preview lock

on:
  push:
    branches:
      - agent/ios-expo-go-preview
    paths:
      - apps/mobile/package.json
      - .github/workflows/mobile-preview-lock.yml

permissions:
  contents: write

concurrency:
  group: mobile-preview-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/ios-expo-go-preview

      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Generate a clean SDK 54 lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --legacy-peer-deps
          npm ci --legacy-peer-deps

      - name: Validate the mobile preview
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
        run: |
          npm run check
          npx expo-doctor@latest

      - name: Commit the generated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh SDK 54 mobile preview lockfile"
          git push origin HEAD:agent/ios-expo-go-preview
