name: Validate pnpm policy and Milestone 1

on:
  push:
    branches:
      - agent/milestone-1-foundation
    paths:
      - .github/workflows/validate-pnpm-policy.yml

permissions:
  contents: write
  pull-requests: write

env:
  APP_ENV: preview
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-publishable-key
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-1-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply pnpm policy repair
        run: |
          python3 .bootstrap/pnpm_policy.py
          rm -rf .bootstrap .github/workflows/validate-pnpm-policy.yml
      - name: Install pnpm
        run: npm install --global pnpm@11.0.0
      - name: Resolve, generate and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm icons:generate
          pnpm format
      - name: Commit package policy and resolved lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden pnpm dependency build policy"
          git push origin HEAD:agent/milestone-1-foundation
      - name: Run ordered application checks
        run: pnpm check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production browser checks
        run: pnpm test:e2e
      - name: Run local database smoke test
        run: |
          pnpm db:start
          trap 'pnpm db:stop' EXIT
          pnpm test:db
      - name: Capture environment information
        run: pnpm exec next info
      - name: Record successful validation
        run: |
          cat > docs/validation.md <<EOF
          # Milestone 1 validation

          Validated in a clean GitHub-hosted Ubuntu environment on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          - Node: $(node --version)
          - pnpm: $(pnpm --version)
          - pnpm check: passed
          - pnpm test:e2e: passed
          - pnpm test:db: passed

          Dependency build scripts are explicitly allowlisted for esbuild, Sharp, Supabase CLI and Tailwind's native engine. The committed suite covers server-rendered direction, mobile overflow, serious and critical accessibility findings, PWA resources and registration, the no-store health endpoint, and pgTAP.

          This branch contains Milestone 1 only and no Stage A business feature.
          EOF
          git add docs/validation.md
          if ! git diff --cached --quiet; then
            git commit -m "Record successful Milestone 1 validation"
            git push origin HEAD:agent/milestone-1-foundation
          fi
      - name: Ensure a draft pull request exists
        run: |
          if ! gh pr view agent/milestone-1-foundation --repo AnasGherfal/mithaq >/dev/null 2>&1; then
            gh pr create \
              --repo AnasGherfal/mithaq \
              --base main \
              --head agent/milestone-1-foundation \
              --draft \
              --title "Build Milestone 1 project foundation" \
              --body "Milestone 1 foundation with Arabic-first routing, Supabase boundaries, conservative PWA behavior, automated tests, CI and documentation. No Stage A business features are included."
          fi
